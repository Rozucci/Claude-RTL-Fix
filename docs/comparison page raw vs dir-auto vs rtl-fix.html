<!doctype html><html><head><meta charset="utf-8"><title>RTL comparison</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>body{font:15px/1.6 -apple-system,system-ui,sans-serif;margin:16px;background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{border:1px solid #ccc;border-radius:8px;padding:8px 12px}
h2{font-size:14px;margin:0 0 6px;color:#555}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:2px 6px}code{background:#eee;padding:0 3px}</style></head>
<body><div class="grid">
<div class="col"><h2>1. Raw text, plain renderer</h2><div id="a" dir="ltr"></div></div>
<div class="col"><h2>2. Raw text, dir=auto per block</h2><div id="b"></div></div>
<div class="col"><h2>3. Through rtl-fix, plain renderer</h2><div id="c" dir="ltr"></div></div>
</div><script>const d={"raw":"Astro یک فریم‌ورک است.\n\nاین پروژه با Claude Code (v2) ساخته شد.\n\n- مورد اول با React\n- زیرمورد با **Claude Code** و *TypeScript*\n\n> نقل‌قول با API و نسخهٔ v0.2.0 (با Node 26).\n\nقیمت 12.5 USD، دمای 25°C و سرعت 100 km/h است.\n\nدستور `npm run dev` رو بزن.\n\n| نمونه | توضیح |\n|---|---|\n| سرعت CPU | خانهٔ فارسی جدول |","fixed":"‏⁧⁦Astro⁩ یک فریم‌ورک است.⁩\n\n‏⁧این پروژه با ⁦Claude Code⁩ (⁦v2⁩) ساخته شد.⁩\n\n- ‏⁧مورد اول با ⁦React⁩⁩\n- ‏⁧زیرمورد با **⁦Claude Code⁩** و *⁦TypeScript⁩*⁩\n\n> ‏⁧نقل‌قول با ⁦API⁩ و نسخهٔ ⁦v0.2.0⁩ (با ⁦Node 26⁩).⁩\n\n‏⁧قیمت ⁦12.5 USD⁩، دمای ⁦25°C⁩ و سرعت ⁦100 km/h⁩ است.⁩\n\n‏⁧دستور ⁦`npm run dev`⁩ رو بزن.⁩\n\n| ‏⁧نمونه⁩ | ‏⁧توضیح⁩ |\n|---|---|\n| ‏⁧سرعت ⁦CPU⁩⁩ | ‏⁧خانهٔ فارسی جدول⁩ |"};
a.innerHTML=marked.parse(d.raw);b.innerHTML=marked.parse(d.raw);c.innerHTML=marked.parse(d.fixed);
b.querySelectorAll('p,li,blockquote,td,th,h1,h2,h3').forEach(e=>e.setAttribute('dir','auto'));</script></body></html>
